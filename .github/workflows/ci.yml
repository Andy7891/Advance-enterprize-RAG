name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `ruff check` = linting (flake8's job). `ruff format --check` = formatting
      # verification (black --check's job). --check is NON-mutating on purpose: CI
      # asserts the committed code is already correct, it never silently rewrites it.
      - name: Ruff lint + format check
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      # Separate from ruff: ruff does not type-check at all. ignore_missing_imports
      # in pyproject.toml suppresses "third-party lib ships no stubs" noise so only
      # real type errors surface here.
      - name: mypy type check
        run: |
          mypy src/

  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # -v so a failure in the Actions log names the exact failing test, not just a dot.
      # --cov reports which lines ran, which is how a test that passes without
      # exercising the code it claims to test gets caught (see P2-M5). Reported,
      # not enforced: a threshold tempts writing filler tests to hit a number.
      # -m "not tiktoken" keeps the run offline; that one test needs an encoding
      # file a fresh runner would have to fetch over the network. Live tests need
      # Qdrant and Ollama, which this Windows runner cannot start as service
      # containers, so they are deselected by name rather than left to skip
      # quietly; -rs still lists anything else that skipped, with its reason.
      - name: Run pytest
        run: |
          pytest tests/ -v -rs -m "not tiktoken and not live" --cov=src --cov-report=term-missing

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Context is `.` (repo root), NOT infra/docker/, because the Dockerfile's
      # COPY instructions reference pyproject.toml and src/ which live at the root.
      # The image is never pushed — this job exists only to prove the Dockerfile
      # still builds, catching "changed pyproject.toml, broke the image" drift.
      - name: Build Docker image (validates Dockerfile)
        run: |
          docker build -f infra/docker/Dockerfile -t advance-rag:ci .
