name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # TODO(learning): Ruff has two separate jobs it can do here:
      #   1. Style/error linting (replaces flake8) — the subcommand is `ruff check`.
      #   2. Formatting verification, NON-mutating (replaces `black --check`) — the
      #      subcommand is `ruff format`, and there's a flag that makes it just report
      #      whether files WOULD be reformatted, instead of rewriting them. Look at
      #      `ruff format --help` to find it (hint: same flag name pattern as `black`'s).
      # Run both. Point ruff at the src/ and tests/ directories.
      - name: Ruff lint + format check
        run: |
          echo "TODO: run ruff check on src/ and tests/"
          echo "TODO: run ruff format in check-only (non-mutating) mode on src/ and tests/"

