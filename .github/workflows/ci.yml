      # First run it and just read the errors it produces on our current codebase — don't
      # fix anything yet. Ask yourself: are these real type problems, or is mypy just
      # missing type stubs for a third-party library? `ignore_missing_imports = true` in
      # pyproject.toml already suppresses the second category.
      - name: mypy type check
        run: |
          echo "TODO: run mypy against the src/ directory"

  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # TODO(learning): run pytest against the tests/ directory. Add the `-v` flag while
      # you're setting this up so failures are easy to read in the Actions log; you can
      # drop it back to quiet (`-q`) once this is stable.
      - name: Run pytest
        run: |
          echo "TODO: run pytest against tests/"

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO(learning): `docker build` needs three things here:
      #   1. `-f` pointing at our Dockerfile's actual path (it's NOT at the repo root —
      #      check infra/docker/ from Step 1.1).
