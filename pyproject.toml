[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advance-rag"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation (RAG) system with GraphRAG, hybrid retrieval, and observability"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Prachi Magare", email = "prachimagare170@gmail.com" } ]
requires-python = ">=3.11,<3.12"

dependencies = [
  # Orchestration
  "langchain==1.3.15",
  # Bumped 0.3.30 -> 0.4.2: langchain-experimental 0.4.2 (SemanticChunker)
  # requires langchain-community >=0.4.2. See decision.md, D-2026-09-15-03.
  "langchain-community==0.4.2",
  # Semantic chunking. NOTE: "experimental" package -- API may break between
  # minor versions without deprecation. Pinned exactly for that reason.
  "langchain-experimental==0.4.2",
  # Embeddings for semantic chunk-boundary detection (maintained path;
  # langchain_community.embeddings.OllamaEmbeddings is deprecated).
  "langchain-ollama==1.1.0",
  # Knowledge graph (GraphRAG)
  "neo4j==6.2.0",
  # Vector database
  "qdrant-client==1.19.0",
  # Reranking
  "cohere==7.0.8",
  # API layer
  "fastapi==0.141.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  # UI
  "streamlit==1.61.1",
  # Utilities
  "python-dotenv==1.2.3",
  "httpx==0.28.1",
  "requests==2.34.2",
  # Document ingestion (PDF text extraction)
  "pypdf==6.16.1",
  # Token counting. Pinned explicitly: it was previously present only as a
  # transitive dep of langchain-openai, so any LangChain change could have
  # removed it silently from under us.
  "tiktoken==0.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ragas==0.4.3",
  "ruff==0.16.3",
  "mypy==1.19.0",
  "docker==7.2.0",
  "ipykernel==7.3.0",
  # Pinned rather than left as an ad-hoc install: an unpinned tool that CI
  # depends on is the same trap tiktoken was in before P2-M3.
  "pytest-cov==7.1.0",
]

[project.urls]
"homepage" = "https://github.com/prachimagare/advance-rag"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

# Registering markers explicitly turns a typo'd marker into an error rather
# than a silently-ignored test selector.
[tool.pytest.ini_options]
markers = [
  "tiktoken: needs tiktoken's encoding file (network on a cold cache); deselect with -m 'not tiktoken'",
]

# Ruff replaces both black (formatting) and flake8 (linting) in one tool.
# TODO(learning): read https://docs.astral.sh/ruff/rules/ and decide which
# rule sets beyond the defaults you want (e.g. "I" for isort-style import
# sorting, "UP" for pyupgrade-style modernization).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]  # pycodestyle errors/warnings + pyflakes (flake8's core rules)

# mypy: static type checking, separate concern from ruff (ruff does NOT type-check).
# TODO(learning): try flipping `strict = true` once your codebase has more type
# hints, and see how many errors it surfaces — that's mypy teaching you where
# your type coverage is thin.
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
