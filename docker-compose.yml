services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26.0
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      # Required, not defaulted: a fallback password would silently run the graph
      # with a known credential. NEO4J_AUTH is applied ONLY when neo4j_data is first
      # created; afterwards it is ignored and the password must be changed in Cypher.
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (see .env.example)}"
      # Do NOT add other NEO4J_* variables for our own use: the image turns every
      # NEO4J_* variable into a neo4j.conf setting, and strict config validation
      # then refuses to start on unknown ones (NEO4J_PASSWORD -> setting "PASSWORD").
      # The APOC Core jar ships in the image's labs folder, so this enables it
      # without a download; graph tooling (e.g. LangChain schema reads) expects it.
      NEO4J_PLUGINS: '["apoc"]'
      # Fixed sizes instead of auto-sizing from host RAM, which Ollama and Qdrant
      # share on this machine; ample for a graph of this corpus's size.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Logs in over Bolt and runs a query, so "healthy" means the protocol and the
      # credentials work -- an HTTP probe on 7474 passes even with a wrong password.
      # Credentials are split out of NEO4J_AUTH ("user/password") by the container's
      # shell: ${X%%/*} keeps what is before the first "/", ${X#*/} what is after it.
      # $$ stops compose substituting them itself.
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:0.20.0
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WHAT: Defines the name of the service in this Docker Compose cluster.
  # WHY: Allows other containers to network with your application using 'http://api'.
  # --------------------------------------------------------------------------------
  api:

    # --------------------------------------------------------------------------------
    # WHAT: Tells Docker Compose that this image must be built from a local file.
    # WHY: It cannot be pulled pre-built from a registry like Docker Hub.
    # --------------------------------------------------------------------------------
    build:

      # --------------------------------------------------------------------------------
      # WHAT: Specifies the root directory (build context) for the Docker engine.
      # WHY: Paths in your Dockerfile (like COPY) are relative to this root folder.
      # --------------------------------------------------------------------------------
      context: .

      # --------------------------------------------------------------------------------
      # WHAT: Points to the exact location of the target configuration blueprint.
      # WHY: Required when the Dockerfile is kept in a nested infrastructure sub-folder.
      # --------------------------------------------------------------------------------
      dockerfile: infra/docker/Dockerfile

    # --------------------------------------------------------------------------------
    # WHAT: Maps network access from the physical host machine into the container.
    # WHY: Allows your machine's browser/tools to communicate with your running app.
    # --------------------------------------------------------------------------------
    ports:
      - "8000:8000"

    # --------------------------------------------------------------------------------
    # WHAT: Injects runtime variables into the operating environment of your code.
    # WHY: Configures your application without hardcoding credentials or configurations.
    # --------------------------------------------------------------------------------
    environment:
      # WHAT: Target network address for a vector database cluster.
      # WHY: Routes vector embeddings and similarity queries to the 'qdrant' service.
      QDRANT_URL: "http://qdrant:6333"

      # WHAT: Connection URI for the graph database using native binary protocol.
      # WHY: Directs entity relationship and graph structural queries to 'neo4j'.
      NEO4J_URI: "bolt://neo4j:7687"

      # WHAT: Access username matching the target database instance.
      # WHY: Uses local environment variables or defaults back to standard fallback value.
      NEO4J_USER: "${NEO4J_USER:-neo4j}"

      # WHAT: Access authorization secret key for the graph database instance.
      # WHY: Required from .env with no fallback, so the stack never runs on a known password.
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (see .env.example)}"

      # WHAT: Network endpoint connection string for local language model execution.
      # WHY: Directs text processing and generation requests to the 'ollama' service.
      OLLAMA_URL: "http://ollama:11434"

      # WHAT: Authorization token string for cloud language model infrastructure.
      # WHY: Passes external credentials down safely, failing over to blank if missing.
      COHERE_API_KEY: "${COHERE_API_KEY:-}"

    # --------------------------------------------------------------------------------
    # WHAT: Orchestrates container initialization sequences and conditions.
    # WHY: Prevents the app from starting or failing until dependencies are functional.
    # --------------------------------------------------------------------------------
    depends_on:
      # WHAT: Dependency mapping requirement for vector lookups.
      # WHY: Holds app initialization until the internal database health checks pass.
      qdrant:
        condition: service_healthy

      # WHAT: Dependency mapping requirement for graph relationship lookups.
      # WHY: Holds app initialization until the graph engine confirms ready status.
      neo4j:
        condition: service_healthy

      # WHAT: Dependency mapping requirement for local model inferences.
      # WHY: Holds app initialization until model execution endpoints answer calls.
      ollama:
        condition: service_healthy

volumes:
  qdrant_data:
  neo4j_data:
  ollama_data:
